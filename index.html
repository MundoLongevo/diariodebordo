<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desatando Nós - Longevidade Sustentável</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'sand-50': '#fcfbf9',
              'sand-100': '#f4f1ea',
              'sand-200': '#e6dec8',
              'rope-500': '#8c7e63',
              'rope-700': '#5e5340',
              'ocean-800': '#1e3a4c',
              'ocean-900': '#132532',
              'clay-500': '#bf6b59',
            },
            fontFamily: {
              serif: ['Georgia', 'Cambria', 'Times New Roman', 'Times', 'serif'],
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'slide-up': 'slideUp 0.6s ease-out',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } }
            }
          }
        }
      }
    </script>
    <style>
      html { scroll-behavior: smooth; }
      body { -webkit-tap-highlight-color: transparent; }
      .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-sand-50 text-ocean-900 font-sans antialiased selection:bg-rope-200 selection:text-rope-900">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // Types & Enums
      const AppView = {
        HOME: 'HOME',
        PROFILES: 'PROFILES',
        COMMANDMENTS: 'COMMANDMENTS',
        QUIZ: 'QUIZ'
      };

      // Icons (simplified - using SVG paths)
      const Icon = ({ type, className = "w-8 h-8" }) => {
        const icons = {
          heart: "M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z",
          plane: "M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z",
          cart: "M9 2a1 1 0 0 0 0 2h.24l1.46 5.91-2.13 3.17A1 1 0 0 0 9 15h6.14l.6 2H5v2h14v-2h-2.68l-1.12-3.53A2 2 0 0 0 13.41 13H11.7l1.4-2.13 2.55 1.03A2 2 0 0 0 18 10V9a1 1 0 0 0-1.45-.91l-2.77 1.11L11.3 2.8A2 2 0 0 0 9.68 2H9z M6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z M17 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4z",
          user: "M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z",
          tag: "M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z M7 7h.01",
          mouse: "M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z M13 13l6 6",
          activity: "M22 12h-4l-3 9L9 3l-3 9H2",
          monitor: "M12 2v4 M12 18v4 M4.93 4.93l2.83 2.83 M16.24 16.24l2.83 2.83 M2 12h4 M18 12h4 M4.93 19.07l2.83-2.83 M16.24 7.76l2.83-2.83",
          sun: "M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z",
          wallet: "M21 12V7H5a2 2 0 0 1 0-4h14v4 M3 5v14a2 2 0 0 0 2 2h16v-5 M18 12a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"
        };
        
        return (
          <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <path d={icons[type] || icons.heart} />
          </svg>
        );
      };

      // Data
      const PROFILES = [
        { id: 1, title: "O CDC Financiador de Afetos", quote: "O que eu queria mesmo era que ele viesse aqui tomar um café...", description: "Transforma amor em crédito para ajudar filhos e netos.", mechanism: "Necessidade de pertencimento e medo de perder relevância.", risk: "Relações tornam-se transacionais; vira um 'caixa eletrônico emocional'.", iconType: 'heart', category: 'familiar' },
        { id: 9, title: "O Sol da Constelação Familiar", quote: "Eu sei que estou me acabando. Mas é pela paz deles.", description: "Sustenta a harmonia familiar pagando contas.", mechanism: "Culpa parental tardia.", risk: "Exaustão emocional e financeira.", iconType: 'sun', category: 'familiar' },
        { id: 3, title: "O Viciado em Serotoninas", quote: "Chega o pacote e eu sinto um alívio, sabe?", description: "Usa compras como dopamina para anestesiar afetos.", mechanism: "Vazio existencial e solidão.", risk: "Dependência emocional do consumo.", iconType: 'cart', category: 'existencial' },
        { id: 4, title: "O Negacionista da Aposentadoria", quote: "Eu não aceito essa vida de aposentado, doutor.", description: "Recusa-se a aceitar que a renda mudou.", mechanism: "Apego extremo à identidade profissional.", risk: "Esgotamento rápido da reserva financeira.", iconType: 'user', category: 'existencial' },
        { id: 5, title: "O Ostentador Inseguro", quote: "Tiro tudo e fico comigo mesmo... aí vejo que é só eu.", description: "Busca status para compensar invisibilidades.", mechanism: "Medo de desaparecer socialmente.", risk: "Autoestima condicionada ao consumo.", iconType: 'tag', category: 'existencial' },
        { id: 8, title: "O Jovem Velho", quote: "A foto ficou jovem... mas eu não.", description: "Investe compulsivamente em estética e viagens.", mechanism: "Negação do envelhecimento.", risk: "Alegrias momentâneas, dívidas duradouras.", iconType: 'monitor', category: 'existencial' },
        { id: 2, title: "O Kamikaze Financeiro", quote: "Senti que era minha chance de mostrar que ainda sei ganhar dinheiro.", description: "Acredita em 'grandes oportunidades' e arrisca demais.", mechanism: "Orgulho ferido e desejo de provar sagacidade.", risk: "Perda rápida de patrimônio e vergonha.", iconType: 'plane', category: 'social' },
        { id: 6, title: "O Digitalmente Frágil", quote: "Me senti burra, ridícula...", description: "Cai em golpes digitais e links suspeitos.", mechanism: "Boa-fé excessiva e dificuldade tecnológica.", risk: "Grandes perdas e vergonha de contar.", iconType: 'mouse', category: 'social' },
        { id: 7, title: "O Equilibrista Financeiro", quote: "Minha vida virou um emaranhado de dívidas.", description: "Vive de empréstimos para cobrir dívidas anteriores.", mechanism: "Ausência histórica de planejamento.", risk: "Cativeiro emocional e violência econômica.", iconType: 'activity', category: 'social' },
        { id: 10, title: "O Pernalonga do Custeio", quote: "Fico pensando se é culpa minha...", description: "Endividado pelo custo básico da velhice.", mechanism: "Impotência diante da inflação e custo de saúde.", risk: "Sensação injusta de fracasso.", iconType: 'wallet', category: 'social' }
      ];

      const COMMANDMENTS = [
        { id: 1, text: "Não confundirás amor com transferência bancária." },
        { id: 2, text: "Não acharás que és o rei do investimento." },
        { id: 3, text: "Não comprarás alegria em prestações." },
        { id: 4, text: "Aceitarás tua aposentadoria." },
        { id: 5, text: "Não ostentarás para ser visto." },
        { id: 6, text: "Desconfiarás das ofertas milagrosas." },
        { id: 7, text: "Fugirás dos agiotas como do capeta." },
        { id: 8, text: "Amarás teu rosto enrugado." },
        { id: 9, text: "Exigirás dignidade, não esmolas." },
        { id: 10, text: "Romperás com a Indústria da Juventude Eterna." },
        { id: 11, text: "Nunca hipotecarás teu tempo de vida futuro." },
        { id: 12, text: "Não acreditarás nas propagandas de turismo 'baratinhas'." },
        { id: 13, text: "Não acharás que estás velho demais para buscar renda." },
        { id: 14, text: "Não entrarás em roubadas amorosas dispendiosas." },
        { id: 15, text: "Não gastarás tudo no presente, como se não houvesse amanhã." },
        { id: 16, text: "Exigirás que o sistema te enxergue, unindo-te a outros." }
      ];

      const QUIZ_QUESTIONS = [
        { id: 1, text: "Quando um familiar pede dinheiro emprestado, qual seu primeiro sentimento?", options: [{ text: "Alívio por poder ser útil, mesmo que me aperte.", score: 3 }, { text: "Preocupação, mas não consigo dizer não.", score: 2 }, { text: "Analiso se posso emprestar sem me prejudicar.", score: 0 }] },
        { id: 2, text: "Como você se sente em relação à sua aparência hoje?", options: [{ text: "Invisto o que for preciso para parecer mais jovem.", score: 3 }, { text: "Aceito minhas rugas, são minha história.", score: 0 }, { text: "Sinto que preciso compensar a idade com roupas caras.", score: 2 }] },
        { id: 3, text: "Sobre oportunidades de investimento que prometem alto retorno rápido:", options: [{ text: "Desconfio imediatamente. Não existe milagre.", score: 0 }, { text: "Sinto vontade de provar que ainda sou esperto e invisto.", score: 3 }] }
      ];

      // Canvas Component
      const KnotCanvas = () => {
        const canvasRef = useRef(null);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          const resize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
          };
          resize();
          window.addEventListener('resize', resize);

          class Knot {
            constructor() {
              this.x = Math.random() * canvas.width;
              this.y = Math.random() * canvas.height;
              this.vx = (Math.random() - 0.5) * 0.3;
              this.vy = (Math.random() - 0.5) * 0.3;
              this.radius = Math.random() * 2 + 1;
            }

            update() {
              this.x += this.vx;
              this.y += this.vy;
              if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
              if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }

            draw() {
              ctx.beginPath();
              ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
              ctx.fillStyle = 'rgba(140, 126, 99, 0.15)';
              ctx.fill();
            }
          }

          const knots = Array.from({ length: 40 }, () => new Knot());

          const animate = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            knots.forEach((knot, i) => {
              knot.update();
              knot.draw();
              for (let j = i + 1; j < knots.length; j++) {
                const dx = knots[j].x - knot.x;
                const dy = knots[j].y - knot.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 150) {
                  ctx.beginPath();
                  ctx.moveTo(knot.x, knot.y);
                  ctx.lineTo(knots[j].x, knots[j].y);
                  ctx.strokeStyle = `rgba(140, 126, 99, ${0.1 * (1 - dist / 150)})`;
                  ctx.lineWidth = 0.5;
                  ctx.stroke();
                }
              }
            });
            requestAnimationFrame(animate);
          };
          animate();

          return () => window.removeEventListener('resize', resize);
        }, []);

        return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full pointer-events-none z-0" style={{ opacity: 0.5 }} />;
      };

      // Profile Card Component
      const ProfileCard = ({ profile }) => {
        const [expanded, setExpanded] = useState(false);

        return (
          <div className="bg-white rounded-[2rem] shadow-sm border border-sand-100 overflow-hidden hover:shadow-xl transition-all">
            <div className="p-8">
              <div className="flex items-start gap-4 mb-4">
                <div className="bg-sand-100 p-4 rounded-2xl">
                  <Icon type={profile.iconType} className="w-8 h-8 text-rope-700" />
                </div>
                <div className="flex-1">
                  <h3 className="text-xl font-bold mb-2 leading-tight">{profile.title}</h3>
                  <p className="text-sm italic text-gray-500 leading-relaxed">"{profile.quote}"</p>
                </div>
              </div>

              <button
                onClick={() => setExpanded(!expanded)}
                className="text-[10px] font-bold uppercase tracking-widest text-rope-700 hover:underline mb-4"
              >
                {expanded ? 'Ocultar' : 'Ver mais'}
              </button>

              {expanded && (
                <div className="space-y-4 animate-fade-in border-t border-sand-100 pt-4">
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-widest text-gray-400 block mb-2">Descrição</span>
                    <p className="text-sm text-gray-700">{profile.description}</p>
                  </div>
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-widest text-gray-400 block mb-2">Mecanismo</span>
                    <p className="text-sm text-gray-700">{profile.mechanism}</p>
                  </div>
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-widest text-gray-400 block mb-2">Risco</span>
                    <p className="text-sm text-clay-500 font-medium">{profile.risk}</p>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      };

      // Risk Meter Component
      const RiskMeter = ({ score }) => {
        const perc = Math.min(100, (score / 9) * 100);
        const color = perc > 70 ? 'bg-red-500' : perc > 35 ? 'bg-yellow-500' : 'bg-green-500';
        return (
          <div className="max-w-md mx-auto my-10 p-6 bg-sand-100 rounded-[2rem] border border-sand-200 shadow-inner">
            <div className="flex justify-between text-[10px] font-bold uppercase text-gray-400 mb-3 px-2">
              <span>Soberania</span>
              <span>Vulnerabilidade</span>
            </div>
            <div className="h-3 bg-gray-200 rounded-full overflow-hidden">
              <div className={`h-full ${color} transition-all duration-1000`} style={{width: `${perc}%`}} />
            </div>
            <div className="text-center mt-4 text-xs font-bold opacity-60">Seu Índice de Nó Emocional: {Math.round(perc)}%</div>
          </div>
        );
      };

      // Main App Component
      const App = () => {
        const [view, setView] = useState(AppView.HOME);
        const [score, setScore] = useState(0);
        const [done, setDone] = useState(false);

        useEffect(() => { window.scrollTo(0,0); }, [view]);

        const handleQuizAnswer = (optScore, questionIndex) => {
          setScore(s => s + optScore);
          if (questionIndex === QUIZ_QUESTIONS.length - 1) {
            setDone(true);
          }
        };

        return (
          <div className="min-h-screen flex flex-col font-sans selection:bg-rope-200">
            <KnotCanvas />
            
            <nav className="sticky top-0 z-50 bg-sand-50/80 backdrop-blur-md border-b border-sand-200 h-20 flex items-center px-6">
              <div className="max-w-7xl mx-auto w-full flex justify-between items-center">
                <div onClick={() => setView(AppView.HOME)} className="cursor-pointer font-serif font-bold text-2xl group transition-colors hover:text-rope-700">
                  Desatando<span className="text-rope-700">Nós</span>
                </div>
                <div className="hidden md:flex gap-8 text-[10px] font-bold uppercase tracking-widest">
                  <button onClick={() => setView(AppView.HOME)} className={`transition-colors ${view === AppView.HOME ? 'text-rope-700' : 'hover:text-rope-700'}`}>Início</button>
                  <button onClick={() => setView(AppView.PROFILES)} className={`transition-colors ${view === AppView.PROFILES ? 'text-rope-700' : 'hover:text-rope-700'}`}>Perfis</button>
                  <button onClick={() => setView(AppView.COMMANDMENTS)} className={`transition-colors ${view === AppView.COMMANDMENTS ? 'text-rope-700' : 'hover:text-rope-700'}`}>Pacto</button>
                  <button onClick={() => setView(AppView.QUIZ)} className={`transition-colors ${view === AppView.QUIZ ? 'text-rope-700' : 'hover:text-rope-700'}`}>Teste</button>
                </div>
              </div>
            </nav>

            <main className="flex-grow container mx-auto px-6 py-12 relative z-10">
              {view === AppView.HOME && (
                <div className="max-w-5xl mx-auto text-center space-y-16 animate-fade-in py-10">
                  <header className="space-y-6">
                    <h1 className="text-6xl md:text-8xl font-serif font-bold tracking-tighter">
                      Quando a conta <span className="text-rope-700 italic">não fecha</span>
                    </h1>
                    <p className="text-xl text-gray-500 max-w-2xl mx-auto font-light leading-relaxed">
                      Uma jornada sensível sobre o endividamento na longevidade baseada no manifesto de Ricardo de Faria Barros.
                    </p>
                    <div className="p-6 bg-white/40 border border-sand-200 rounded-[2.5rem] inline-block shadow-sm">
                      <p className="text-rope-700 italic font-serif leading-relaxed">"A dignidade é o fio que desata qualquer nó."</p>
                    </div>
                  </header>
                  
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <button onClick={() => setView(AppView.PROFILES)} className="bg-white p-10 rounded-[2.5rem] border border-black/5 hover:shadow-2xl hover:-translate-y-2 transition-all text-left">
                      <h3 className="text-2xl font-bold text-ocean-900 mb-2">10 Perfis</h3>
                      <p className="text-sm opacity-60 text-ocean-900 mb-6">A face humana da dívida.</p>
                    </button>
                    <button onClick={() => setView(AppView.COMMANDMENTS)} className="bg-ocean-800 text-white p-10 rounded-[2.5rem] border border-black/5 hover:shadow-2xl hover:-translate-y-2 transition-all text-left">
                      <h3 className="text-2xl font-bold mb-2">Pacto</h3>
                      <p className="text-sm opacity-60 mb-6">Ética da dignidade.</p>
                    </button>
                    <button onClick={() => setView(AppView.QUIZ)} className="bg-clay-500 text-white p-10 rounded-[2.5rem] border border-black/5 hover:shadow-2xl hover:-translate-y-2 transition-all text-left">
                      <h3 className="text-2xl font-bold mb-2">Teste</h3>
                      <p className="text-sm opacity-60 mb-6">Identifique seus nós.</p>
                    </button>
                  </div>
                </div>
              )}

              {view === AppView.PROFILES && (
                <div className="space-y-16 animate-slide-up max-w-7xl mx-auto">
                  <header className="text-center max-w-2xl mx-auto space-y-4">
                    <h2 className="text-5xl font-serif font-bold">Territórios do Endividamento</h2>
                    <p className="text-gray-500">Explore as raízes emocionais de cada perfil.</p>
                  </header>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-10">
                    {['existencial', 'familiar', 'social'].map(cat => (
                      <div key={cat} className="space-y-6">
                        <h3 className="text-[10px] font-bold uppercase tracking-widest text-gray-400 border-b border-sand-200 pb-2">{cat}</h3>
                        <div className="grid gap-6">
                          {PROFILES.filter(p => p.category === cat).map(p => <ProfileCard key={p.id} profile={p} />)}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {view === AppView.COMMANDMENTS && (
                <div className="max-w-3xl mx-auto space-y-12 animate-fade-in py-10">
                  <h2 className="text-5xl font-serif font-bold text-center">O Pacto</h2>
                  <div className="grid gap-6">
                    {COMMANDMENTS.map(c => (
                      <div key={c.id} className="bg-white p-8 rounded-[2rem] shadow-sm flex gap-6 items-start hover:shadow-xl transition-shadow border border-sand-100">
                        <span className="text-4xl font-serif text-sand-200 font-bold">{String(c.id).padStart(2, '0')}</span>
                        <p className="text-lg font-medium text-ocean-900 pt-1 leading-snug">{c.text}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {view === AppView.QUIZ && (
                <div className="max-w-2xl mx-auto animate-fade-in py-10">
                  {done ? (
                    <div className="bg-white p-12 rounded-[3rem] shadow-2xl text-center">
                      <h2 className="text-4xl font-serif font-bold mb-4">Seu Diagnóstico</h2>
                      <RiskMeter score={score} />
                      <p className="text-gray-600 mb-10 leading-relaxed">Este índice reflete o quanto suas emoções estão impactando sua liberdade financeira. Desatar esses nós requer coragem e consciência.</p>
                      <div className="flex gap-4 justify-center">
                        <button onClick={() => { setScore(0); setDone(false); }} className="px-6 py-4 font-bold text-sm underline opacity-50">Refazer</button>
                        <button onClick={() => setView(AppView.PROFILES)} className="px-10 py-4 bg-ocean-900 text-white rounded-full font-bold shadow-lg">Explorar Soluções</button>
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-10">
                      <header className="text-center"><h2 className="text-4xl font-serif font-bold">Auto-Teste</h2><p className="text-gray-400">Escute os silêncios que pedem voz.</p></header>
                      {QUIZ_QUESTIONS.map((q, i) => (
                        <div key={q.id} className="bg-white p-10 rounded-[2.5rem] shadow-sm border border-sand-200">
                          <h3 className="text-xl font-bold mb-8">{i + 1}. {q.text}</h3>
                          <div className="grid gap-4">
                            {q.options.map((o, oi) => (
                              <button key={oi} onClick={() => handleQuizAnswer(o.score, i)} className="w-full text-left p-5 rounded-2xl bg-sand-50 hover:bg-ocean-800 hover:text-white transition-all font-medium border border-sand-200">
                                {o.text}
                              </button>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </main>

            <footer className="bg-ocean-900 text-sand-50 py-20 text-center space-y-6">
              <p className="font-serif italic text-2xl opacity-60">"A dignidade não tem juros."</p>
              <div className="space-y-1">
                <p className="text-[10px] font-bold uppercase tracking-[0.3em] opacity-30">Manifesto 'Quando a conta não fecha'</p>
                <p className="text-[10px] font-bold uppercase tracking-[0.3em] opacity-30">Ricardo de Faria Barros</p>
              </div>
            </footer>
          </div>
        );
      };

      // Render
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
